[package]
name = "pulse-app"
version = "0.1.0"
description = "Pulse — local trading journal"
edition = "2021"

[lib]
name = "pulse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulse-core = { path = "../crates/pulse-core" }
