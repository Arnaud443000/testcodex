name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The core crate has no UI dependency, so it is tested on Linux without WebKit.
      - run: cargo test -p pulse-core
      # Lot 20: the network crate is tested against a fake local server; the key vault is checked for Windows.
      - run: cargo test -p pulse-ai -p pulse-vault
      # Lot 22: the lock's cryptography is pure Rust, tested here and checked for Windows like the vault.
      - run: cargo test -p pulse-lock
      - run: rustup target add x86_64-pc-windows-msvc && cargo check -p pulse-vault -p pulse-lock --target x86_64-pc-windows-msvc --all-targets
