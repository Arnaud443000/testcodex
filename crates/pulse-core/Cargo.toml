[package]
name = "pulse-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rust_decimal = { version = "1", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
