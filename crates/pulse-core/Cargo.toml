[package]
name = "pulse-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "serialize"] }
# Lot 22: optional password lock (pure Rust cryptography, no network).
pulse-lock = { path = "../pulse-lock" }
rust_decimal = { version = "1", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
pdf-writer = "0.15.0"
ttf-parser = "0.25.1"
miniz_oxide = "0.9.1"

[dev-dependencies]
lopdf = "0.45.0"
tempfile = "3.27.0"
